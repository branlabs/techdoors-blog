name: Validate site

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, production build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:site
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/portal.spec.ts --project=desktop --grep 'living SVG portal is a subtle accessible interaction in light' --workers=1
      - name: Upload portal visuals for PR review
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-interaction-preview
          path: test-results/**/portal-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
